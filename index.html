<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor de monitoramento</title>
</head>
<body>
    <h1>Servidor de Monitoramento</h1>
    <button id="all" onclick="fetchDevices()">Todos os dispositivos</button> <br><br>
    <input type="number" id="deviceId" placeholder="Número de ID do dispositivo">
    <button id="butId" onclick="fetchDevice()">Dispositivo por ID</button>
    <div>
        <h2 id="info"></h2>
    </div>
    <script>
        const butAll = document.getElementById('all');
        const butId = document.getElementById('butId');
        const infoPanel = document.getElementById('info');

        async function fetchDevices() {
            try {
                const response = await fetch('http://localhost:3600/dispositivos');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                infoPanel.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error fetching devices:', error);
                infoPanel.textContent = `Error: ${error.message}`;
            }
        }

        async function fetchDevice() {
            const deviceId = document.getElementById('deviceId').value
            try {
                const response = await fetch(`http://localhost:3600/dispositivos/${deviceId}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                infoPanel.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error fetching devices:', error);
                infoPanel.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
